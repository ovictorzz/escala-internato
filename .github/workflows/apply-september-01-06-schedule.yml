name: Apply September 01-06 schedule
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply September 01-06 schedule data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_september_schedule.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply September 01-06 schedule data"
          git push
