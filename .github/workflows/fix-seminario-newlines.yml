name: Corrigir quebras de linha dos seminários

on:
  push:
    branches:
      - agent/fix-seminarios-18-08-2
    paths:
      - .github/workflows/fix-seminario-newlines.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-seminarios-18-08-2

      - name: Corrigir temas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          nl = chr(92) + 'n'

          def set_tema(date, value):
              global text
              m = re.search(r'(\{\s*data:\s*"' + re.escape(date) + r'".*?\n\},)', text, re.S)
              if not m:
                  raise SystemExit(f'Item {date} não encontrado')
              block = m.group(1)
              block, count = re.subn(r'(\btema:\s*")[^"]*(")', lambda x: x.group(1) + value + x.group(2), block, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Tema {date} não encontrado')
              text = text[:m.start(1)] + block + text[m.end(1):]

          set_tema('08/09', '• Síndromes Hipertensivas e Gestação (Pré-Eclâmpsia/Eclâmpsia/Síndrome HELLP)' + nl + '• Diabetes Gestacional')
          set_tema('15/09', '• Anatomia Genital Feminina Aplicada à Uroginecologia: Incontinência Urinária Feminina' + nl + '• HPV e Câncer de Colo de Útero')
          set_tema('22/09', '• Prolapsos Genitais: Classificação de Bump (POP-Q)' + nl + '• Tumores Benignos e Malignos do Ovário')

          for date in ('08/09','15/09','22/09'):
              m = re.search(r'\{\s*data:\s*"' + re.escape(date) + r'".*?\n\},', text, re.S)
              if not m or nl not in m.group(0):
                  raise SystemExit(f'Quebra de linha escapada ausente em {date}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Salvar e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/fix-seminario-newlines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-seminario-newlines.yml
          git diff --cached --check
          git commit -m "Corrige quebras de linha dos seminários"
          git push origin HEAD:agent/fix-seminarios-18-08-2
