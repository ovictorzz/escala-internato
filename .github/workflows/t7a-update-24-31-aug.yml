# Disparo temporário da escala 24–31/08
name: Aplicar escala 24 a 31 de agosto

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-escala:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

