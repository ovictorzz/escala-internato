name: Direct Face ID menu fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="    document.open();"
          if 'direct-faceid-menu-fix-v1' in s:
              raise SystemExit(0)
          inject=r'''    const directFaceIdMenuFix = `<script id="direct-faceid-menu-fix-v1">
(()=>{
  const ensureFaceId=()=>{
    if(innerWidth>=1024) return;
    const root=document.getElementById('mobile-menu-stable');
    if(!root) return;
    const grid=root.querySelector('[class*="mms-account-v"] [class*="-grid"]') || root.querySelector('.mms-list');
    if(!grid || grid.querySelector('[data-direct-faceid="1"]')) return;
    const btn=document.createElement('button');
    btn.type='button';
    btn.dataset.directFaceid='1';
    btn.className='faceid full';
    btn.style.gridColumn='1 / -1';
    btn.style.minHeight='52px';
    btn.style.display='flex';
    btn.style.alignItems='center';
    btn.style.justifyContent='center';
    btn.style.gap='9px';
    btn.style.borderRadius='13px';
    btn.style.border='1px solid rgba(56,189,248,.28)';
    btn.style.background='linear-gradient(135deg,rgba(14,165,233,.14),rgba(59,130,246,.09))';
    btn.style.color='#7dd3fc';
    btn.style.font="750 12px/1.1 'Outfit',sans-serif";
    btn.innerHTML='<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 3H6a3 3 0 00-3 3v2m13-5h2a3 3 0 013 3v2M8 21H6a3 3 0 01-3-3v-2m13 5h2a3 3 0 003-3v-2M9 10h.01M15 10h.01M9 15c1.7 1.35 4.3 1.35 6 0"/></svg><span>Cadastrar Face ID neste aparelho</span>';
    const admin=grid.querySelector('[data-x="admin"], .admin');
    if(admin) grid.insertBefore(btn,admin); else grid.appendChild(btn);
    btn.addEventListener('click',()=>{
      root.classList.remove('is-open');
      document.documentElement.style.overflow='';
      if(typeof window.abrirConfiguracaoFaceID==='function') window.abrirConfiguracaoFaceID();
      else document.getElementById('faceid-setup-button')?.click();
    });
  };
  const start=()=>{ensureFaceId(); setInterval(ensureFaceId,300); new MutationObserver(ensureFaceId).observe(document.documentElement,{childList:true,subtree:true});};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
<\/script>`;
    html=html.replace('</body>',directFaceIdMenuFix+'</body>');

'''
          if marker not in s:
              raise SystemExit('marker not found')
          s=s.replace(marker,inject+marker,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Face ID button directly in mobile menu"
          git push
