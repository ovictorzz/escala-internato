name: Normalizar seminários

on:
  push:
    branches:
      - agent/fix-seminarios-18-08-2
    paths:
      - .github/workflows/normalize-seminarios.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-seminarios-18-08-2

      - name: Normalizar dados dos seminários
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          continuation = chr(92) + '\n'

          def set_fields(date, fields):
              global text
              m = re.search(r'(\{\s*data:\s*"' + re.escape(date) + r'".*?\n\},)', text, re.S)
              if not m:
                  raise SystemExit(f'Item {date} não encontrado')
              block = m.group(1)
              for key, value in fields.items():
                  pat = re.compile(r'(\b' + re.escape(key) + r':\s*")[^"]*(")', re.S)
                  block, count = pat.subn(lambda x, v=value: x.group(1) + v + x.group(2), block, count=1)
                  if count != 1:
                      raise SystemExit(f'Campo {key} não encontrado em {date}')
              text = text[:m.start(1)] + block + text[m.end(1):]

          set_fields('18/08', {
              'mediador': 'Dra. Marta | Dr. Fernando',
          })
          set_fields('08/09', {
              'apresentadores': 'Giovanna Muniz, Rayane Maria, Sofia Dias',
              'tema': '• Síndromes Hipertensivas e Gestação (Pré-Eclâmpsia/Eclâmpsia/Síndrome HELLP)' + continuation + '• Diabetes Gestacional',
          })
          set_fields('15/09', {
              'apresentadores': 'Leticia Teixeira, Júlia Matos, Luiza Sales',
              'tema': '• Anatomia Genital Feminina Aplicada à Uroginecologia: Incontinência Urinária Feminina' + continuation + '• HPV e Câncer de Colo de Útero',
          })
          set_fields('22/09', {
              'apresentadores': 'Ana Clara, Carolina Banholi, Kamilly Lima',
              'tema': '• Prolapsos Genitais: Classificação de Bump (POP-Q)' + continuation + '• Tumores Benignos e Malignos do Ovário',
          })

          # Garante uma única barra invertida antes da quebra de linha em cada tema com 2 linhas.
          if (chr(92) * 2 + '\n') in text:
              raise SystemExit('Encontrada barra invertida duplicada antes de quebra de linha')

          required = [
              'Dra. Marta | Dr. Fernando',
              'Giovanna Muniz, Rayane Maria, Sofia Dias',
              'Síndromes Hipertensivas e Gestação (Pré-Eclâmpsia/Eclâmpsia/Síndrome HELLP)',
              'Leticia Teixeira, Júlia Matos, Luiza Sales',
              'Anatomia Genital Feminina Aplicada à Uroginecologia: Incontinência Urinária Feminina',
              'Ana Clara, Carolina Banholi, Kamilly Lima',
              'Prolapsos Genitais: Classificação de Bump (POP-Q)',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'Validação falhou: {value}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Salvar e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/normalize-seminarios.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/normalize-seminarios.yml
          git diff --cached --check
          git commit -m "Normaliza dados dos seminários"
          git push origin HEAD:agent/fix-seminarios-18-08-2
