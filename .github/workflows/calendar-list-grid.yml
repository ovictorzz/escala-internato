name: Aplicar modos Lista e Grade no calendário

on:
  push:
    branches:
      - agent/calendar-list-grid
    paths:
      - .github/workflows/calendar-list-grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/calendar-list-grid

      - name: Atualizar visualizações do calendário
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_switch = '''.calendar-view-switch {
          display: none;
          align-items: center;'''
          new_switch = '''.calendar-view-switch {
          display: flex;
          align-items: center;'''
          if old_switch not in text:
              raise SystemExit('Bloco calendar-view-switch não encontrado.')
          text = text.replace(old_switch, new_switch, 1)

          anchor = '''@media (min-width: 1024px) {
          .calendar-day-card { min-height: 166px; }
          .calendar-shift { font-size: 11px; padding: .42rem .5rem; }
          .calendar-shift-period { font-size: 10px; }
          }

          @media (max-width: 767px) {'''

          universal_list = '''@media (min-width: 1024px) {
          .calendar-day-card { min-height: 166px; }
          .calendar-shift { font-size: 11px; padding: .42rem .5rem; }
          .calendar-shift-period { font-size: 10px; }
          }

          /* Lista e grade ficam disponíveis em qualquer tamanho de tela. */
          .calendar-months.calendar-mobile-list .calendar-month-grid {
          display: flex !important;
          flex-direction: column;
          gap: .65rem;
          }

          .calendar-months.calendar-mobile-list .calendar-weekday,
          .calendar-months.calendar-mobile-list .calendar-empty {
          display: none !important;
          }

          .calendar-months.calendar-mobile-list .calendar-day-card {
          min-height: 0;
          height: auto !important;
          padding: .8rem;
          gap: .6rem;
          transform: none !important;
          }

          .calendar-months.calendar-mobile-list .calendar-day-name-mobile {
          display: inline !important;
          }

          .calendar-months.calendar-mobile-list .calendar-shift {
          grid-template-columns: 5rem minmax(0, 1fr);
          gap: .65rem;
          font-size: 12px;
          line-height: 1.35;
          padding: .55rem .65rem;
          border-radius: .65rem;
          }

          .calendar-months.calendar-mobile-list .calendar-shift-period {
          font-size: 10px;
          padding-top: .08rem;
          }

          .calendar-months.calendar-mobile-list .calendar-shift-text {
          font-size: 12px;
          }

          @media (max-width: 767px) {'''

          if anchor not in text:
              raise SystemExit('Âncora de CSS do calendário não encontrada.')
          text = text.replace(anchor, universal_list, 1)

          old_toolbar = '''<div class="md:hidden sticky top-0 z-20 flex items-center justify-between gap-3 px-1 py-1.5 bg-zinc-100/90 dark:bg-[#080a11]/90 backdrop-blur-xl rounded-xl">'''
          new_toolbar = '''<div class="sticky top-0 z-20 flex flex-wrap items-center justify-between gap-3 px-2 py-2 bg-zinc-100/90 dark:bg-[#080a11]/90 backdrop-blur-xl rounded-xl border border-black/5 dark:border-white/5">'''
          if old_toolbar not in text:
              raise SystemExit('Barra de visualização do calendário não encontrada.')
          text = text.replace(old_toolbar, new_toolbar, 1)

          old_function = '''window.definirVisualizacaoCalendarioMobile = function(modo) {
          const visualizacao = modo === 'grade' ? 'grade' : 'lista';
          try { localStorage.setItem('calendarioMobileView', visualizacao); } catch (e) {}
          renderizarCalendarioMensal();
          }'''
          new_function = '''window.definirVisualizacaoCalendarioMobile = function(modo) {
          const visualizacao = modo === 'grade' ? 'grade' : 'lista';
          try {
          localStorage.setItem('calendarioView', visualizacao);
          localStorage.setItem('calendarioMobileView', visualizacao);
          } catch (e) {}
          renderizarCalendarioMensal();
          }'''
          if old_function not in text:
              raise SystemExit('Função de preferência do calendário não encontrada.')
          text = text.replace(old_function, new_function, 1)

          old_pref = '''let visualizacaoMobile = 'lista';
          try { visualizacaoMobile = localStorage.getItem('calendarioMobileView') === 'grade' ? 'grade' : 'lista'; } catch (e) {}'''
          new_pref = '''let visualizacaoMobile = 'lista';
          try {
          const preferenciaCalendario = localStorage.getItem('calendarioView') || localStorage.getItem('calendarioMobileView');
          visualizacaoMobile = preferenciaCalendario === 'grade' ? 'grade' : 'lista';
          } catch (e) {}'''
          if old_pref not in text:
              raise SystemExit('Leitura da preferência do calendário não encontrada.')
          text = text.replace(old_pref, new_pref, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar e enviar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Adiciona modos lista e grade ao calendário"
          git push origin HEAD:agent/calendar-list-grid
