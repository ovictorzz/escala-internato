name: Aplicar correções dos seminários 18-08

on:
  push:
    branches:
      - agent/fix-seminarios-18-08-2
    paths:
      - .github/workflows/apply-seminarios-18-08.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-seminarios-18-08-2

      - name: Aplicar alterações
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def update_item(date, **fields):
              global text
              pattern = re.compile(r'(\{\s*data:\s*"' + re.escape(date) + r'".*?\n\},)', re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Item de {date} não encontrado')
              block = match.group(1)
              for key, value in fields.items():
                  field_pattern = re.compile(r'(\b' + re.escape(key) + r':\s*")[^"]*(")', re.S)
                  block, count = field_pattern.subn(lambda m, v=value: m.group(1) + v + m.group(2), block, count=1)
                  if count != 1:
                      raise SystemExit(f'Campo {key} de {date} não encontrado')
              text = text[:match.start(1)] + block + text[match.end(1):]

          update_item('18/08', mediador='Dra. Marta | Dr. Fernando')

          update_item(
              '08/09',
              apresentadores='Giovanna Muniz, Rayane Maria, Sofia Dias',
              tema='• Síndromes Hipertensivas e Gestação (Pré-Eclâmpsia/Eclâmpsia/Síndrome HELLP)\\\n• Diabetes Gestacional'
          )

          update_item(
              '15/09',
              apresentadores='Leticia Teixeira, Júlia Matos, Luiza Sales',
              tema='• Anatomia Genital Feminina Aplicada à Uroginecologia: Incontinência Urinária Feminina\\\n• HPV e Câncer de Colo de Útero'
          )

          update_item(
              '22/09',
              apresentadores='Ana Clara, Carolina Banholi, Kamilly Lima',
              tema='• Prolapsos Genitais: Classificação de Bump (POP-Q)\\\n• Tumores Benignos e Malignos do Ovário'
          )

          checks = [
              ('18/08', 'Dra. Marta | Dr. Fernando'),
              ('08/09', 'Giovanna Muniz, Rayane Maria, Sofia Dias'),
              ('08/09', 'Síndromes Hipertensivas e Gestação'),
              ('15/09', 'Leticia Teixeira, Júlia Matos, Luiza Sales'),
              ('15/09', 'Anatomia Genital Feminina Aplicada à Uroginecologia'),
              ('22/09', 'Ana Clara, Carolina Banholi, Kamilly Lima'),
              ('22/09', 'Prolapsos Genitais: Classificação de Bump (POP-Q)'),
          ]
          for date, expected in checks:
              item = re.search(r'\{\s*data:\s*"' + re.escape(date) + r'".*?\n\},', text, re.S)
              if not item or expected not in item.group(0):
                  raise SystemExit(f'Validação falhou em {date}: {expected}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remover workflow temporário e salvar
        shell: bash
        run: |
          rm -f .github/workflows/apply-seminarios-18-08.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-seminarios-18-08.yml
          git diff --cached --check
          git commit -m "Corrige escala dos seminários"
          git push origin HEAD:agent/fix-seminarios-18-08-2
