<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel T7A</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{display:grid;min-height:100vh;min-height:100dvh;place-items:center;padding:24px;text-align:center}.boot-card{max-width:520px}.err{color:#fca5a5;line-height:1.5}
</style>
</head>
<body>
<div id="boot" class="boot-card" aria-live="polite">Carregando o Painel T7A…</div>
<script>
(async()=>{
  try{
    const response=await fetch('https://raw.githubusercontent.com/ovictorzz/escala-internato/main/base-index.html',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const src=await response.text();
    if(!src.includes('PED T7A') && !src.includes('ped-stat-restantes'))throw new Error('Base do painel inválida');
    document.open();
    document.write(src);
    document.close();
  }catch(err){
    console.error(err);
    const boot=document.getElementById('boot');
    boot.innerHTML='<div class="boot-card err"><strong>Não foi possível carregar o Painel T7A.</strong><br>Atualize a página. Se o erro persistir, avise o administrador.</div>';
  }
})();
</script>
</body>
</html>
