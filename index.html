<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel T7A</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{display:none;min-height:100vh;min-height:100dvh;place-items:center;padding:24px;text-align:center}.boot-card{max-width:520px}.err{color:#fca5a5;line-height:1.5}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"></div>
<script>
(async()=>{
  try {
    let src = await (await fetch('https://raw.githubusercontent.com/ovictorzz/escala-internato/1f1a3cf6a2e520743fb50b625e8e1205c2a08dcf/index.html', { cache: 'no-store' })).text();

    const anchor = `    src = src.replace(datasAntigas, datasNovas);`;
    const replacement = [
      `    src = src.replace(datasAntigas, datasNovas);`,
      `    const patch01a04Outubro = \`// 01/10 a 04/10 — escala assistencial ainda não enviada.
const datasAguardandoEscala01a04Outubro = new Set(["01/10","02/10","03/10","04/10"]);
for (let i=1;i<=10;i++) {
  const idTrio=String(i);
  const forcarSemEscala = idTrio==="2" || idTrio==="10";
  for (let semana=1;semana<=9;semana++) {
    const dias=dadosEscala[idTrio]?.semanas?.[semana]||{};
    Object.values(dias).forEach(infoDia=>{
      if(!datasAguardandoEscala01a04Outubro.has(String(infoDia?.data||""))) return;
      (infoDia.turnos||[]).forEach(turno=>{
        if(forcarSemEscala) {
          if(!compromissoAcademicoFixoSetembro(turno)) turno.local=ESCALA_NAO_ENVIADA;
        } else if(turno.local==="—") {
          turno.local=ESCALA_NAO_ENVIADA;
        }
      });
    });
  }
}
// A base antiga considerava 01/10–04/10 como escala já enviada para os Trios 02 e 10.
// Remove essas datas antes da rotina que transforma pendências em "Livre".
["2","10"].forEach(idTrio=>{
  datasComEscalaEnviadaPorTrio[idTrio]=(datasComEscalaEnviadaPorTrio[idTrio]||[])
    .filter(data=>!datasAguardandoEscala01a04Outubro.has(String(data)));
});
\`;`,
      `    src = src.replace(datasNovas, patch01a04Outubro + "\\n" + datasNovas);`
    ].join("\n");

    if (!src.includes(anchor)) throw new Error('Ponto de confirmação da escala não encontrado');
    src = src.replace(anchor, replacement);

    const lucimara24Antiga = `"24/09":{manha:"Dra. Lucimara (HRC)"},"25/09":{manha:"Dr. F. Mota (HRC)",tarde:"CO (HRC)"}`;
    const lucimara24Nova = `"24/09":{tarde:"Dra. Lucimara (HRC)"},"25/09":{manha:"Dr. F. Mota (HRC)",tarde:"CO (HRC)"}`;
    if (!src.includes(lucimara24Antiga)) throw new Error('Ponto da Dra. Lucimara no Trio 10 em 24/09 não encontrado');
    src = src.replace(lucimara24Antiga, lucimara24Nova);

    const regraHorarioBL = `
<script id="bl-hours-rule-20260909">
(()=>{
  const normalizarBL=(valor)=>String(valor||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().trim();
  const aplicarHorarioBL=()=>{
    try {
      if (typeof dadosEscala === 'undefined') return;
      for (let idTrio=1; idTrio<=10; idTrio++) {
        Object.values(dadosEscala[idTrio]?.semanas||{}).forEach(semana=>{
          Object.values(semana||{}).forEach(infoDia=>{
            (infoDia.turnos||[]).forEach(turno=>{
              const local=normalizarBL(turno.local);
              const periodo=normalizarBL(turno.periodo);
              if ((local==='BL' || local.startsWith('BL (')) && periodo.includes('MANHA')) {
                turno.horario='08h-13h';
              }
            });
          });
        });
      }
    } catch (erro) {
      console.warn('Não foi possível aplicar o horário do BL.', erro);
    }
  };
  const anterior=typeof window.aplicarHorariosEspeciaisAtividades==='function' ? window.aplicarHorariosEspeciaisAtividades : null;
  if (anterior && !anterior.__incluiBL08h) {
    const combinado=function(){ anterior(); aplicarHorarioBL(); };
    combinado.__incluiBL08h=true;
    window.aplicarHorariosEspeciaisAtividades=combinado;
  }
  aplicarHorarioBL();
})();
<\/script>`;
    src = src.replace('</body>', regraHorarioBL + '\n</body>');

    document.open();
    document.write(src);
    document.close();
  } catch (err) {
    console.error(err);
    const boot=document.getElementById('boot');
    boot.style.display='grid';
    boot.innerHTML='<div class="boot-card err"><strong>Não foi possível carregar o Painel T7A.</strong><br>Atualize a página. Se o erro persistir, avise o administrador.</div>';
  }
})();
</script>
</body>
</html>
