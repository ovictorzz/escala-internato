<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel G.O. - Internato T7A</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020203; 
            color: #e4e4e7;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, transparent 25%), 
                              radial-gradient(circle at 100% 100%, #312e81 0%, transparent 25%);
            background-attachment: fixed;
        }
        .font-outfit { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        
        .glass-panel {
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-panel:hover {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <div id="login-overlay" class="fixed inset-0 z-50 backdrop-blur-xl flex items-center justify-center p-4" style="background-image: linear-gradient(to bottom, rgba(2, 2, 3, 0.8), rgba(2, 2, 3, 0.98)), url('fundo.jpg'); background-size: cover; background-position: bottom center;">
        <div class="glass-panel rounded-[2rem] p-8 max-w-sm w-full shadow-2xl shadow-black space-y-7 text-center relative overflow-hidden transition-all duration-500 transform hover:scale-[1.02]">
            <div class="absolute -top-16 -right-16 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.3)]">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            
            <div class="space-y-1.5">
                <h2 class="text-2xl font-outfit font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400">Escala de 2026.2</h2>
                <p class="text-xs text-zinc-400 leading-relaxed font-medium">
                    Identificação obrigatória para a Turma T7A<br>
                    <span class="text-blue-400/80 font-semibold tracking-wide">feito por André Victor</span>
                </p>
            </div>
            
            <div class="space-y-4">
                <input type="password" id="senha-input" placeholder="Digite a senha de acesso" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-4 text-white text-sm font-medium focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-center transition-all placeholder:text-zinc-600 shadow-inner">
                <button onclick="verificarSenha()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-outfit font-bold tracking-wide py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-95">ACESSAR SISTEMA</button>
                <p id="erro-msg" class="text-xs text-rose-400 font-semibold hidden animate-pulse">Senha incorreta. Tente novamente.</p>
            </div>
        </div>
    </div>

    <header class="glass-panel border-b-white/5 sticky top-0 z-30 shadow-lg shadow-black/20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500/20 to-indigo-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shrink-0 shadow-[0_0_15px_rgba(59,130,246,0.15)]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                </div>
                <div>
                    <h1 class="text-xs sm:text-sm font-bold text-white tracking-tight">
                        Internato de Medicina – 10º semestre – <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 font-extrabold font-outfit">Ginecologia & Obstetrícia</span>
                    </h1>
                    <p class="text-[10px] text-zinc-400 font-semibold tracking-widest uppercase mt-0.5">
                        Painel de Rodízios • Criado por André Victor
                    </p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 self-end sm:self-center font-outfit">
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-zinc-300 text-[11px] font-bold tracking-wide">T7A</span>
                <span id="contador-dias" class="px-3 py-1.5 rounded-lg bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] font-bold tracking-wide shadow-[0_0_10px_rgba(59,130,246,0.1)]">Calculando...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 space-y-8 relative">
        
        <div class="grid grid-cols-1 lg:grid-cols-1
