<!-- Scripts do Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ⚠️ Você pegará essas chaves quando criar o projeto gratuito no Firebase
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "seu-projeto.firebaseapp.com",
        databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
        projectId: "seu-projeto",
        storageBucket: "seu-projeto.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const capotesRef = ref(db, 'estatisticas/capotes');

    // OLHA A MÁGICA AQUI: O 'onValue' fica escutando o banco 24h por dia.
    // Se a Andressa mudar no celular dela, o Firebase avisa o seu celular na mesma hora e roda essa função:
    onValue(capotesRef, (snapshot) => {
        const data = snapshot.val();
        window.capotesCount = data || 0; // Atualiza a variável global
        document.getElementById('contador-capotes-val').innerText = window.capotesCount;
    });

    // Função para alterar e enviar para a nuvem
    window.alterarCapotesGlobal = async function(delta) {
        // Primeiro, pega o valor mais atualizado da nuvem para evitar conflitos se duas pessoas clicarem juntas
        const snapshot = await get(capotesRef);
        let valorAtual = snapshot.val() || 0;
        
        let novoValor = valorAtual + delta;
        if (novoValor < 0) novoValor = 0;
        
        // Salva na nuvem (isso vai acionar o onValue de todo mundo automaticamente)
        set(capotesRef, novoValor);
    }
</script>
