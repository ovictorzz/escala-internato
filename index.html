<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel T7A</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{display:none;min-height:100vh;min-height:100dvh;place-items:center;padding:24px;text-align:center}.boot-card{max-width:520px}.err{color:#fca5a5;line-height:1.5}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"></div>
<script>
(async()=>{
  try {
    let src = await (await fetch('https://raw.githubusercontent.com/ovictorzz/escala-internato/2a680a55c1be1ec48e069207994d9eff21deef28/index.html', { cache: 'no-store' })).text();

    const anchorEscalaSemana = `Object.entries(escala01a06Setembro).forEach(([idTrio,escala])=>aplicarEscalaEspecifica(idTrio,escala));

// Reaplica horários-base; PS FICHA, PS BOX e Amb UNIEURO recebem os horários especiais depois.`;

    const escalaSemana07a13 = `Object.entries(escala01a06Setembro).forEach(([idTrio,escala])=>aplicarEscalaEspecifica(idTrio,escala));

// Escala recebida em 07/09/2026 — período de 07/09 a 13/09.
// Dias marcados como "mantém" preservam integralmente a escala que já estava publicada.
const datasAssistenciais07a13Setembro = ["07/09","08/09","09/09","10/09","11/09","12/09","13/09"];
const manterDias07a13Setembro = {
  "4": new Set(["08/09","09/09","10/09","11/09","12/09"]),
  "5": new Set(["08/09"]),
  "6": new Set(["09/09","10/09","11/09","12/09","13/09"])
};

// Nos demais dias, turnos não informados ficam livres, preservando apenas atividades acadêmicas fixas.
for (let i=1;i<=10;i++) {
  const idTrio=String(i);
  datasAssistenciais07a13Setembro.forEach(data=>{
    if (manterDias07a13Setembro[idTrio]?.has(data)) return;
    const infoDia=localizarInfoDiaPatch(idTrio,data);
    if(!infoDia) return;
    (infoDia.turnos||[]).forEach(turno=>{
      if(compromissoAcademicoFixoSetembro(turno)) return;
      turno.local="—";
      if(horarioBasePorPeriodoSetembro[turno.periodo]) turno.horario=horarioBasePorPeriodoSetembro[turno.periodo];
    });
  });
}

const escala07a13Setembro = {
"1":{"08/09":{manha:"CO (HRC)"},"09/09":{manha:"Dr. Caio (PNAR) (HRC)"},"10/09":{manha:"PS BOX (HRC)",tarde:"Dra. Sádia (HRC)"},"11/09":{manha:"PS BOX (HRC)",tarde:"PS FICHA (HRC)"}},
"2":{"08/09":{manha:"BL (HRC)"},"09/09":{manha:"Poli (Dra. Mirna) (HRC)"},"10/09":{manha:"BL (HRC)",tarde:"Dr. Caio (PNAR) (HRC)"},"11/09":{manha:"CO (HRC)"},"13/09":{manha:"CO (HRC)"}},
"3":{"08/09":{manha:"ALCON (HRC)"},"09/09":{manha:"Dra. Lorena (ECO) (HRC)"},"10/09":{manha:"ALCON (HRC)"},"11/09":{manha:"CC (HRC)"},"12/09":{noite:"CO (HRC)"},"13/09":{manha:"ALCON (HRC)"}},
"4":{"13/09":{manha:"PS BOX (HRC)"}},
"5":{"09/09":{manha:"Amb UNIEURO"},"10/09":{tarde:"Dra. Lucimara (HRC)",noite:"PS FICHA (HRC)"},"11/09":{manha:"Dr. Caio (PNAR) (HRC)",tarde:"CO (HRC)"}},
"6":{"08/09":{tarde:"PS FICHA (HRC)"}},
"7":{"08/09":{tarde:"Dra. Sádia (HRC)"},"10/09":{manha:"ALCON (HRC)",tarde:"CC (HRC)"},"11/09":{manha:"Dra. Gilmária (HRC)"},"12/09":{manha:"PS BOX (HRC)"},"13/09":{manha:"ALCON (HRC)",tarde:"CO (HRC)"}},
"8":{"08/09":{manha:"PS FICHA (HRC)"},"09/09":{manha:"Amb UNIEURO"},"10/09":{manha:"Poli (Dra. Mirna) (HRC)",tarde:"Dra. Gilmária (HRC)"},"11/09":{manha:"Dr. F. Mota (HRC)"}},
"9":{"08/09":{tarde:"CO (HRC)"},"09/09":{manha:"Amb UNIEURO"},"10/09":{tarde:"CO (HRC)"},"11/09":{tarde:"Poli (Dra. Mirna) (HRC)",noite:"CO (HRC)"}},
"10":{"08/09":{manha:"ALCON (HRC)",tarde:"PS BOX (HRC)"},"10/09":{tarde:"PS FICHA (HRC)",noite:"CO (HRC)"},"11/09":{manha:"Dra. Nádia (EUD) (HRC)"},"13/09":{noite:"CO (HRC)"}}
};
Object.entries(escala07a13Setembro).forEach(([idTrio,escala])=>aplicarEscalaEspecifica(idTrio,escala));

// Reaplica horários-base; PS FICHA, PS BOX e Amb UNIEURO recebem os horários especiais depois.`;

    if (!src.includes(anchorEscalaSemana)) throw new Error('Ponto da escala 07/09–13/09 não encontrado');
    src = src.replace(anchorEscalaSemana, escalaSemana07a13);

    const limpezaAntiga = `const depoisDe06Set = (mm===9 && dd>6) || mm>9;
      if(!depoisDe06Set) return;`;
    const limpezaNova = `const depoisDe13Set = (mm===9 && dd>13) || mm>9;
      if(!depoisDe13Set) return;`;
    if (!src.includes(limpezaAntiga)) throw new Error('Ponto de limite da escala não encontrado');
    src = src.replace(limpezaAntiga, limpezaNova);
    src = src.replace('A escala assistencial publicada termina em 06/09.', 'A escala assistencial publicada termina em 13/09.');

    const datasAntigas = `const datasEscalaRecebida24a31=["24/08","25/08","26/08","27/08","28/08","29/08","30/08","31/08","01/09","02/09","03/09","04/09","05/09","06/09"];`;
    const datasNovas = `const datasEscalaRecebida24a31=["24/08","25/08","26/08","27/08","28/08","29/08","30/08","31/08","01/09","02/09","03/09","04/09","05/09","06/09","07/09","08/09","09/09","10/09","11/09","12/09","13/09"];`;
    if (!src.includes(datasAntigas)) throw new Error('Ponto de confirmação da nova semana não encontrado');
    src = src.replace(datasAntigas, datasNovas);

    document.open();
    document.write(src);
    document.close();
  } catch (err) {
    console.error(err);
    const boot=document.getElementById('boot');
    boot.style.display='grid';
    boot.innerHTML='<div class="boot-card err"><strong>Não foi possível carregar o Painel T7A.</strong><br>Atualize a página. Se o erro persistir, avise o administrador.</div>';
  }
})();
</script>
</body>
</html>
