<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala Internato - G.O.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen pb-10">
    <div class="w-full max-w-md bg-white min-h-screen shadow-lg sm:rounded-3xl sm:mt-4 sm:min-h-[800px] sm:overflow-hidden relative">
        
        <div class="p-6 pb-2">
            <div class="flex items-center space-x-2 text-indigo-600 mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                <h1 class="font-bold text-xl">Internato Médico G.O.</h1>
            </div>

            <div class="relative bg-slate-50 border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer mb-5">
                <div class="flex items-center space-x-4 w-full">
                    <div class="bg-indigo-500 text-white font-bold rounded-lg w-10 h-10 flex items-center justify-center text-sm" id="trio-badge">T1</div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-xs text-slate-500 font-medium mb-0.5">Grupo Selecionado</p>
                        <select id="trio-select" onchange="atualizarEscala()" class="w-full bg-transparent font-semibold text-slate-800 text-sm focus:outline-none appearance-none truncate">
                            <option value="1">André, Davi & Leticia</option>
                            <option value="2">Nadya, Louise & Isabella</option>
                            <option value="3">Hiago, Isabela & Mª Eduarda</option>
                            <option value="4">Heitor, Bruno & Andressa</option>
                            <option value="5">Mª Luiza, Mª Eduarda & Luiza</option>
                            <option value="6">Leticia, Júlia & Luiza</option>
                            <option value="7">Ana Clara, Carolina & Kamilly</option>
                            <option value="8">Giovanna, Rayane & Sofia</option>
                            <option value="9">Annelise, Camila & Gabriella</option>
                            <option value="10">José, João Victor & Ana Luiza</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between mb-4">
                <div class="flex space-x-2">
                    <div class="flex items-center space-x-1.5 border border-emerald-100 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold">
                        <span>336h total</span>
                    </div>
                    <div class="flex items-center space-x-1.5 border border-indigo-100 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-xs font-semibold">
                        <span>33% completo</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 text-xs text-slate-400 font-medium mb-8">
                <div class="h-1 flex-1 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-indigo-500 w-1/3 rounded-full"></div>
                </div>
                <span>Bloco 1 de 3</span>
            </div>
        </div>

        <div class="px-6 pb-6 bg-slate-50 pt-6 rounded-t-3xl border-t border-slate-100">
            <h2 class="font-bold text-slate-800 mb-4">📅 Rodízios do Internato</h2>
            <div id="lista-blocos" class="space-y-3"></div>
        </div>

        <div class="px-6 pb-6 bg-slate-50">
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-sm text-slate-700">📍 Cenário Atual</h3>
                    <span class="bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-md tracking-wider">MAPEADO</span>
                </div>
                <h2 id="cenario-atual" class="text-xl font-black text-slate-800 uppercase tracking-tight">HRC - CENTRO OBSTÉTRICO</h2>
            </div>
        </div>
    </div>

    <script>
        // AQUI VOCÊ EDITA OS HOSPITAIS E DATAS DE CADA TRIO
        const dadosEscala = {
            "1": [
                { bloco: "BLOCO 1", local: "HRC - Centro Obstétrico", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRAN - Enfermaria", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro", ativo: false }
            ],
            "2": [
                { bloco: "BLOCO 1", local: "Policlínica Ceilândia", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRC - Centro Obstétrico", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRAN - Enfermaria", datas: "Outubro", ativo: false }
            ],
            "3": [
                { bloco: "BLOCO 1", local: "HRAN - Enfermaria", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro", ativo: false }
            ],
            "4": [
                { bloco: "BLOCO 1", local: "HRSM - Ambulatório", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "Policlínica Ceilândia", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRC - Centro Obstétrico", datas: "Outubro", ativo: false }
            ],
            "5": [
                { bloco: "BLOCO 1", local: "HRC - Enfermaria", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRAN - Centro Obstétrico", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro", ativo: false }
            ],
            "6": [
                { bloco: "BLOCO 1", local: "HRAN - Centro Obstétrico", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro", ativo: false }
            ],
            "7": [
                { bloco: "BLOCO 1", local: "Policlínica Ceilândia", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRC - Enfermaria", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRAN - Centro Obstétrico", datas: "Outubro", ativo: false }
            ],
            "8": [
                { bloco: "BLOCO 1", local: "HRSM - Ambulatório", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "Policlínica Ceilândia", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRC - Enfermaria", datas: "Outubro", ativo: false }
            ],
            "9": [
                { bloco: "BLOCO 1", local: "HRC - Centro Obstétrico", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRAN - Enfermaria", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro", ativo: false }
            ],
            "10": [
                { bloco: "BLOCO 1", local: "HRAN - Enfermaria", datas: "Agosto", ativo: true },
                { bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro", ativo: false },
                { bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro", ativo: false }
            ]
        };

        function atualizarEscala() {
            const trioId = document.getElementById('trio-select').value;
            const blocos = dadosEscala[trioId];
            
            document.getElementById('trio-badge').innerText = 'T' + trioId;
            const container = document.getElementById('lista-blocos');
            container.innerHTML = ''; 

            let cenarioAtualNome = '';

            blocos.forEach(bloco => {
                const isAtivo = bloco.ativo;
                if(isAtivo) cenarioAtualNome = bloco.local;

                const cardClass = isAtivo ? 'border-indigo-400 bg-indigo-50/50' : 'border-slate-200 bg-white';
                const titleClass = isAtivo ? 'text-indigo-600' : 'text-slate-500';
                const localClass = isAtivo ? 'text-slate-900' : 'text-slate-700';

                container.innerHTML += `
                    <div class="border rounded-2xl p-4 ${cardClass}">
                        <div class="text-[11px] font-bold tracking-wider uppercase mb-1 ${titleClass}">${bloco.bloco}</div>
                        <h3 class="font-bold mb-1 ${localClass}">${bloco.local}</h3>
                        <p class="text-sm text-slate-400 font-medium">${bloco.datas}</p>
                    </div>
                `;
            });

            document.getElementById('cenario-atual').innerText = cenarioAtualNome;
        }

        window.onload = atualizarEscala;
    </script>
</body>
</html>
