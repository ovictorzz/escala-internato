<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel G.O. - Internato Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #171717; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col bg-black text-neutral-200">

    <!-- Header do Sistema -->
    <header class="bg-[#0a0a0a] border-b border-neutral-800 sticky top-0 z-10 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 lg:gap-0">
            <div class="flex items-center space-x-3 sm:space-x-4">
                <div class="bg-blue-600 p-2 sm:p-2.5 rounded-lg text-white shrink-0">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                </div>
                <div>
                    <h1 class="text-xs sm:text-sm md:text-base lg:text-lg font-bold text-white leading-tight">
                        Internato de Medicina – 10º semestre – <span class="text-blue-500">Ginecologia & Obstetrícia</span>
                    </h1>
                    <p class="text-[9px] sm:text-[10px] md:text-xs font-medium text-neutral-400 uppercase tracking-widest mt-1">
                        Painel de Rodízios feito por André Victor
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                <span class="bg-neutral-800 text-neutral-300 border border-neutral-700 px-3 py-1.5 rounded-md text-[10px] sm:text-xs font-semibold whitespace-nowrap">Turma T7A</span>
                <span class="bg-blue-900/30 text-blue-400 border border-blue-800/50 px-3 py-1.5 rounded-md text-[10px] sm:text-xs font-semibold whitespace-nowrap">2026.2</span>
            </div>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
            
            <!-- Coluna Esquerda: Controles e Equipe -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- Card de Seleção -->
                <div class="bg-[#0f0f0f] rounded-2xl border border-neutral-800 p-5 sm:p-6 shadow-sm">
                    <h2 class="text-xs sm:text-sm font-bold text-neutral-400 uppercase tracking-wider mb-4">Selecione seu Grupo</h2>
                    
                    <div class="relative">
                        <select id="grupo-select" onchange="mudarGrupo()" class="w-full bg-[#171717] border border-neutral-700 text-white font-bold text-sm sm:text-base rounded-xl px-4 py-3 sm:py-3.5 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="1">Grupo A1: André, Davi & Leticia</option>
                            <option value="2">Grupo A2: Nadya, Louise & Isabella</option>
                            <option value="3">Grupo A3: Hiago, Isabela & Mª Eduarda</option>
                            <option value="4">Grupo A4: Heitor, Bruno & Andressa</option>
                            <option value="5">Grupo A5: Mª Luiza, Mª Eduarda & Luiza</option>
                            <option value="6">Grupo A6: Leticia, Júlia & Luiza</option>
                            <option value="7">Grupo A7: Ana Clara, Carolina & Kamilly</option>
                            <option value="8">Grupo A8: Giovanna, Rayane & Sofia</option>
                            <option value="9">Grupo A9: Annelise, Camila & Gabriella</option>
                            <option value="10">Grupo A10: José, João Victor & Ana Luiza</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-neutral-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Card da Equipe -->
                <div class="bg-[#0f0f0f] rounded-2xl border border-neutral-800 p-5 sm:p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-xs sm:text-sm font-bold text-neutral-400 uppercase tracking-wider">Integrantes do Trio</h2>
                        <span id="grupo-badge" class="bg-blue-900/40 text-blue-400 border border-blue-800/50 font-bold px-2.5 py-1 rounded-md text-xs">A1</span>
                    </div>
                    
                    <ul id="lista-membros" class="space-y-4">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>

                <!-- Mini Status -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#0f0f0f] border border-neutral-800 rounded-xl p-4 shadow-sm text-center">
                        <div class="text-xl sm:text-2xl font-black text-white">336<span class="text-xs sm:text-sm font-medium text-neutral-500">h</span></div>
                        <div class="text-[9px] sm:text-[10px] font-bold text-neutral-400 uppercase tracking-wider mt-1">Carga Total</div>
                    </div>
                    <div class="bg-[#0f0f0f] border border-neutral-800 rounded-xl p-4 shadow-sm text-center">
                        <div class="text-xl sm:text-2xl font-black text-blue-500">33<span class="text-xs sm:text-sm font-medium text-blue-700">%</span></div>
                        <div class="text-[9px] sm:text-[10px] font-bold text-neutral-400 uppercase tracking-wider mt-1">Concluído</div>
                    </div>
                </div>

            </div>

            <!-- Coluna Direita: Rodízios e Cronograma -->
            <div class="lg:col-span-8 space-y-6">
                
                <!-- Destaque: Cenário Atual (Muda dinamicamente ao clicar no mês) -->
                <div class="bg-gradient-to-r from-blue-700 to-indigo-900 rounded-2xl p-6 sm:p-8 text-white shadow-md relative overflow-hidden flex flex-col justify-center min-h-[160px] sm:min-h-[192px]">
                    <div class="absolute right-0 top-0 w-48 h-48 sm:w-64 sm:h-64 bg-white opacity-5 rounded-full -translate-y-12 translate-x-12 sm:-translate-y-16 sm:translate-x-16 pointer-events-none"></div>
                    
                    <div class="relative z-10">
                        <div class="flex items-center space-x-2 mb-2 sm:mb-3">
                            <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span id="label-cenario-topo" class="text-[10px] sm:text-xs font-bold text-blue-200 uppercase tracking-widest">CENÁRIO ATUAL • AGOSTO</span>
                        </div>
                        <h2 id="cenario-atual-txt" class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight drop-shadow-md">
                            HRC - Centro Obstétrico
                        </h2>
                    </div>
                </div>

                <!-- Cronograma Interativo -->
                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-neutral-400 uppercase tracking-wider mb-4 ml-1">CRONOGRAMA DE RODÍZIOS (Clique no mês para ver)</h3>
                    
                    <div id="lista-blocos" class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-5">
                        <!-- Preenchido via JavaScript -->
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script>
        const dadosEscala = {
            "1": {
                membros: ["André Victor de Oliveira Almeida", "Davi Carvalho Barbosa", "Leticia Barbosa Nunes Otaviano"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRC - Centro Obstétrico", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRAN - Enfermaria", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro" }
                ]
            },
            "2": {
                membros: ["Nadya Veras Jarosczynski", "Louise Albuquerque Mirindiba", "Isabella Teixeira de Lima"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "Policlínica Ceilândia", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRC - Centro Obstétrico", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRAN - Enfermaria", datas: "Outubro" }
                ]
            },
            "3": {
                membros: ["Hiago Kaian Xavier Lisboa", "Isabela Frota Carmona", "Maria Eduarda Lima de Aquino"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRAN - Enfermaria", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro" }
                ]
            },
            "4": {
                membros: ["Heitor Stoduto Mello Ferreira", "Bruno Azevedo Lima", "Andressa Costa Maboni"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRSM - Ambulatório", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "Policlínica Ceilândia", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRC - Centro Obstétrico", datas: "Outubro" }
                ]
            },
            "5": {
                membros: ["Maria Luiza de Ornelas Nobrega", "Maria Eduarda Santiago", "Luiza de Santes"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRC - Enfermaria", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRAN - Centro Obstétrico", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro" }
                ]
            },
            "6": {
                membros: ["Leticia Teixeira Monteiro", "Júlia Matos Guimarães", "Luiza Borges Sales"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRAN - Centro Obstétrico", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro" }
                ]
            },
            "7": {
                membros: ["Ana Clara Estrela Ghisleni", "Carolina Banholi", "Kamilly Lima do vale"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "Policlínica Ceilândia", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRC - Enfermaria", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRAN - Centro Obstétrico", datas: "Outubro" }
                ]
            },
            "8": {
                membros: ["Giovanna Muniz", "Rayane Maria", "Sofia Dias"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRSM - Ambulatório", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "Policlínica Ceilândia", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRC - Enfermaria", datas: "Outubro" }
                ]
            },
            "9": {
                membros: ["Annelise Paiva", "Camila Souza", "Gabriella Reis"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRC - Centro Obstétrico", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRAN - Enfermaria", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "HRSM - Ambulatório", datas: "Outubro" }
                ]
            },
            "10": {
                membros: ["José Henrique Ferreira", "João Victor Tajra", "Ana Luiza Daros"],
                blocos: [
                    { mesKey: "AGOSTO", bloco: "BLOCO 1", local: "HRAN - Enfermaria", datas: "Agosto" },
                    { mesKey: "SETEMBRO", bloco: "BLOCO 2", local: "HRSM - Ambulatório", datas: "Setembro" },
                    { mesKey: "OUTUBRO", bloco: "BLOCO 3", local: "Policlínica Ceilândia", datas: "Outubro" }
                ]
            }
        };

        // Descobre o mês atual do sistema para selecionar por padrão (Agosto = "AGOSTO")
        function getMesAtualKey() {
            const d = new Date();
            const mes = d.getMonth(); // 7 = Agosto
            if (mes === 8) return "SETEMBRO";
            if (mes === 9) return "OUTUBRO";
            return "AGOSTO"; // Padrão inicial (Agosto)
        }

        let mesSelecionadoGlobal = getMesAtualKey();

        function getIniciais(nome) {
            const partes = nome.trim().split(' ');
            if (partes.length > 1) return (partes[0][0] + partes[1][0]).toUpperCase();
            return (nome[0] + nome[1]).toUpperCase();
        }

        function selecionarMes(mesKey) {
            mesSelecionadoGlobal = mesKey;
            mudarGrupo();
        }

        function mudarGrupo() {
            const id = document.getElementById('grupo-select').value;
            const dados = dadosEscala[id];
            
            document.getElementById('grupo-badge').innerText = 'A' + id;

            // Renderiza membros
            const listaMembros = document.getElementById('lista-membros');
            listaMembros.innerHTML = '';
            dados.membros.forEach(nome => {
                listaMembros.innerHTML += `
                    <li class="flex items-center space-x-3">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-xs sm:text-sm font-bold text-neutral-300 flex-shrink-0">
                            ${getIniciais(nome)}
                        </div>
                        <span class="text-xs sm:text-sm font-semibold text-neutral-200 leading-tight">${nome}</span>
                    </li>
                `;
            });

            // Renderiza blocos com interatividade de clique
            const containerBlocos = document.getElementById('lista-blocos');
            containerBlocos.innerHTML = '';

            let localAtivoNoBanner = '';

            dados.blocos.forEach((b, index) => {
                const isSelected = (b.mesKey === mesSelecionadoGlobal);
                if (isSelected) {
                    localAtivoNoBanner = b.local;
                }

                const cardClasses = isSelected 
                    ? 'bg-[#0f0f0f] border-2 border-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.2)] relative cursor-pointer scale-[1.02] transition-all' 
                    : 'bg-[#0a0a0a] border border-neutral-800 hover:border-neutral-700 hover:bg-[#121212] transition-all cursor-pointer';
                
                const titleColor = isSelected ? 'text-blue-400' : 'text-neutral-500';
                const localColor = isSelected ? 'text-white font-bold' : 'text-neutral-400';
                const numBloco = index + 1;

                containerBlocos.innerHTML += `
                    <div onclick="selecionarMes('${b.mesKey}')" class="rounded-2xl p-4 sm:p-5 ${cardClasses}">
                        ${isSelected ? '<div class="absolute top-3 right-3 sm:top-4 sm:right-4"><span class="flex h-2.5 w-2.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span></span></div>' : ''}
                        
                        <div class="flex items-center space-x-2 mb-2 sm:mb-3">
                            <div class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-neutral-800 text-neutral-300 font-bold text-[10px] sm:text-xs flex items-center justify-center">
                                ${numBloco}
                            </div>
                            <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest ${titleColor}">${b.datas}</span>
                        </div>
                        
                        <h4 class="text-sm sm:text-base ${localColor} leading-tight">${b.local}</h4>
                    </div>
                `;
            });

            // Atualiza o banner superior com o mês e o hospital selecionado
            document.getElementById('label-cenario-topo').innerText = `CENÁRIO ATUAL • ${mesSelecionadoGlobal}`;
            document.getElementById('cenario-atual-txt').innerText = localAtivoNoBanner;
        }

        window.onload = mudarGrupo;
    </script>
</body>
</html>
